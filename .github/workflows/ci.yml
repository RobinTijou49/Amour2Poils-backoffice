name: CI/CD

# Chaque push et chaque pull request : lint, typecheck, build.
# Sur main uniquement : publication des images sur GHCR puis déploiement sur le VPS par SSH.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Valeur factice : Prisma lit l'URL au chargement de la config, la base n'est pas jointe pendant le build.
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

jobs:
  check:
    runs-on: ubuntu-latest
    # Base PostgreSQL jetable pour les tests d'intégration (les tests refusent toute base dont le nom ne finit pas par _test).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: amour2poils_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d amour2poils_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/amour2poils_test?schema=public
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Audit des dépendances
        # Échoue sur toute faille « high » ou « critical ». Une seule exception, ignorée volontairement : braces
        # (GHSA-vfj7-8cjw-p6xm, déni de service par motif imbriqué), présent uniquement via eslint-config-next, donc
        # absent de l'image de production (vérifié), et sans version corrigée publiée. À retirer dès qu'un correctif sort.
        run: bun audit --audit-level=high --ignore GHSA-vfj7-8cjw-p6xm
      - run: bun run lint
      - run: bun run typecheck
      - name: Tests unitaires
        run: bun run test
      - name: Préparer la base de test (migrations)
        run: bun run test:db
      - name: Tests d'intégration (Route Handlers, Server Actions, concurrence)
        run: bun run test:int
      - name: Tests de composants (Testing Library)
        run: bun run test:components
      # Les tests E2E (Playwright) s'ajouteront ici (tst-08).
      - run: bun run build
      - name: Aucun secret dans le code envoyé au navigateur
        run: |
          # Le code de .next/static part chez tous les visiteurs : il ne doit jamais citer un secret du serveur.
          if grep -rlE "VAPID_PRIVATE_KEY|CRON_SECRET|DATABASE_URL|passwordHash" .next/static; then
            echo "::error::Un secret ou un champ sensible figure dans le code client"; exit 1
          fi
          # `next build` copie un éventuel .env dans la sortie autonome : il ne doit jamais finir dans l'image.
          if find .next/standalone -name ".env*" | grep -q .; then
            echo "::error::Un fichier .env figure dans .next/standalone"; exit 1
          fi

  # Tests de bout en bout : un vrai navigateur (Chromium) pilote la construction de production sur une base jetable.
  e2e:
    runs-on: ubuntu-latest
    # Image officielle : Chromium et ses dépendances système y sont déjà installés. `playwright install --with-deps` prenait
    # ~15 minutes (apt) pour 70 secondes de tests. LA VERSION DE L'IMAGE DOIT ÊTRE CELLE DE @playwright/test (package.json) :
    # Dependabot ne met pas à jour cette ligne, à changer à la main avec le paquet.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Dans un conteneur, le service est joignable par son nom (« postgres »), pas par localhost.
      # La base de test est créée par tests/e2e/global-setup.ts (son nom doit finir par _test).
      E2E_DATABASE_URL: postgresql://ci:ci@postgres:5432/amour2poils_e2e_test?schema=public
      HOME: /root # Firefox/Chromium dans un conteneur : consigne Playwright
    steps:
      - uses: actions/checkout@v7
      # setup-bun a besoin de `unzip`, absent de l'image Playwright ; Node y est déjà : on installe Bun par npm,
      # à la version exacte du projet (champ packageManager de package.json).
      - name: Installer Bun
        run: npm install --global bun@1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Tests de bout en bout
        run: bunx playwright test
      - name: Rapport et traces (en cas d'échec)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-playwright
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  images:
    needs: [check, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      repo: ${{ steps.name.outputs.repo }}
    steps:
      - uses: actions/checkout@v7
      - id: name
        # GHCR n'accepte que des minuscules.
        run: echo "repo=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image de l'application
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          tags: |
            ${{ steps.name.outputs.repo }}:latest
            ${{ steps.name.outputs.repo }}:${{ github.sha }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
      - name: Image de migration
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrate
          push: true
          tags: |
            ${{ steps.name.outputs.repo }}-migrate:latest
            ${{ steps.name.outputs.repo }}-migrate:${{ github.sha }}
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,mode=max,scope=migrate

  deploy:
    needs: images
    runs-on: ubuntu-latest
    # Secrets à créer dans Settings > Secrets and variables > Actions : SSH_HOST, SSH_USER, SSH_KEY (clé privée),
    # SSH_PORT (facultatif, 22 par défaut). Le fichier .env.production est créé une fois sur le VPS (voir README).
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
      # Dans le dossier personnel de l'utilisateur SSH : aucun droit root nécessaire.
      DEPLOY_DIR: amour2poils
    steps:
      - uses: actions/checkout@v7
      - name: Vérifier les secrets
        run: |
          for v in SSH_HOST SSH_USER; do
            [ -n "${!v}" ] || { echo "::error::Secret $v manquant"; exit 1; }
          done
          [ -n "${{ secrets.SSH_KEY }}" ] || { echo "::error::Secret SSH_KEY manquant"; exit 1; }
      - name: Préparer SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts
      - name: Copier les fichiers de déploiement
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -p $SSH_PORT $SSH_USER@$SSH_HOST"
          $SSH "mkdir -p $DEPLOY_DIR"
          scp -i ~/.ssh/deploy_key -P "$SSH_PORT" docker-compose.prod.yml Caddyfile "$SSH_USER@$SSH_HOST:$DEPLOY_DIR/"
      - name: Mettre à jour les conteneurs
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_REPO: ${{ needs.images.outputs.repo }}
          TAG: ${{ github.sha }}
        run: |
          # Le jeton est envoyé par l'entrée standard (jamais dans la ligne de commande) et expire avec ce job.
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "docker login ghcr.io -u '${{ github.actor }}' --password-stdin >/dev/null && \
             cd $DEPLOY_DIR && \
             export IMAGE_REPO='$IMAGE_REPO' TAG='$TAG' && \
             docker compose -f docker-compose.prod.yml --env-file .env.production pull && \
             docker compose -f docker-compose.prod.yml --env-file .env.production up -d --remove-orphans && \
             docker image prune -f >/dev/null; \
             docker logout ghcr.io >/dev/null"
      - name: Vérifier la santé
        run: |
          for _ in $(seq 1 12); do
            if ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "curl -fsS http://127.0.0.1:8082/api/health"; then echo; exit 0; fi
            sleep 5
          done
          echo "::error::L'application ne répond pas sur /api/health"
          exit 1
