# Base de données locale pour le développement.
# Lancer : docker compose up -d
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-amour2poils}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-amour2poils}
      POSTGRES_DB: ${POSTGRES_DB:-amour2poils}
    ports:
      - "5433:5432"  # 5433 côté hôte : évite le conflit avec un Postgres installé localement
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
