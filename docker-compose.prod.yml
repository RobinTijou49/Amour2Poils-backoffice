# Production : Caddy (port 8082) -> application -> PostgreSQL. Seul Caddy est exposé sur l'hôte.
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d
# Sur le VPS les images viennent de GHCR (poussées par la CI) ; en local, `up --build` les construit.
# Variables : voir .env.production.example (le vrai fichier n'est jamais commité).

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" } # rotation : les logs ne remplissent pas le disque

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data # volume persistant : les données survivent aux mises à jour
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging

  # Exécuté à chaque déploiement avant l'application : applique les migrations puis s'arrête.
  migrate:
    image: ${IMAGE_REPO:-amour2poils}-migrate:${TAG:-latest}
    build: { context: ., target: migrate }
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
    depends_on:
      db: { condition: service_healthy }
    logging: *logging

  app:
    image: ${IMAGE_REPO:-amour2poils}:${TAG:-latest}
    build: { context: ., target: runner }
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
      CRON_SECRET: ${CRON_SECRET:-}
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    # Le healthcheck /api/health est déclaré dans l'image.
    logging: *logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "8082:8082" # 8080 est déjà utilisé sur le VPS
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # certificats (quand un domaine sera configuré)
      - caddy_config:/config
    depends_on:
      app: { condition: service_healthy }
    logging: *logging

volumes:
  pgdata:
  caddy_data:
  caddy_config:
